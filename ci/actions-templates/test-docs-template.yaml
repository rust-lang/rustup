jobs: # skip-all
  # This is ci/actions-templates/test-docs-templates.yaml
  # Do not edit this file in .github/workflows
  #
  # Builds docs for both stable and main branches.
  # stable is placed in the root of the gh-pages branch, while main is placed at /devel
  doc: # job-name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install mdbook
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        env:
          # renovate: datasource=crate depName=mdbook
          MDBOOK_VERSION: "0.5.2"
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Build user-guide (stable)
        run: |
          git checkout stable
          cd doc/user-guide
          mdbook build
          mv book ${{ runner.temp }}
      - name: Build user-guide (main)
        run: |
          git checkout main
          cd doc/user-guide
          mdbook build
          mv book ${{ runner.temp }}/book/devel
      - name: Build dev-guide (main)
        run: |
          git checkout main
          cd doc/dev-guide
          mdbook build
          mv book ${{ runner.temp }}/book/dev-guide
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/book

  doc-deploy: # job-name
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') }}
    needs: doc
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
